# Tool configuration only. The development environment lives in pixi.toml;
# the integration's runtime requirements live in
# custom_components/adaptive_cover/manifest.json. License: see LICENSE (MIT).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  # Deprecations raised from our own package fail the run (P0 target: 0).
  "error::DeprecationWarning:custom_components\\.adaptive_cover",
]

# ---------------------------------------------------------------------------
# Ruff: the single ruff configuration (was .ruff.toml). Rule set based on
# https://github.com/home-assistant/core/blob/dev/pyproject.toml
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "B007",    # Loop control variable {name} not used within loop body
  "B014",    # Exception handler with duplicate exception
  "C",       # complexity
  "D",       # docstrings
  "E",       # pycodestyle
  "F",       # pyflakes/autoflake
  "ICN001",  # import concentions; {name} should be imported as {asname}
  "PGH004",  # Use specific rule codes when using noqa
  "PLC0414", # Useless import alias. Import alias does not rename original package.
  "SIM105",  # Use contextlib.suppress({exception}) instead of try-except-pass
  "SIM117",  # Merge with-statements that use the same scope
  "SIM118",  # Use {key} in {dict} instead of {key} in {dict}.keys()
  "SIM201",  # Use {left} != {right} instead of not {left} == {right}
  "SIM212",  # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
  "SIM300",  # Yoda conditions. Use 'age == 42' instead of '42 == age'.
  "SIM401",  # Use get from dict with default instead of an if block
  "T20",     # flake8-print
  "TRY004",  # Prefer TypeError exception for invalid type
  "RUF006",  # Store a reference to the return value of asyncio.create_task
  "UP",      # pyupgrade
  "W",       # pycodestyle
]
ignore = [
  "D202", # No blank lines allowed after function docstring
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "D404", # First word of the docstring should not be This
  "D406", # Section name should end with a newline
  "D407", # Section name underlining
  "D411", # Missing blank line before section
  "E501", # line too long
  "E731", # do not assign a lambda expression, use a def
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
voluptuous = "vol"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Tests: docstring rules are not enforced (test names are the documentation).
"tests/**" = ["D", "C408", "UP038", "T201"]
# CI helper scripts are command-line tools; printing is their output.
".github/**" = ["T201"]

# ---------------------------------------------------------------------------
# Pyright (basic). CI fails only on errors missing from the committed
# baseline: `pixi run typecheck`; refresh with `pixi run typecheck-baseline`.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["custom_components/adaptive_cover"]
exclude = ["**/__pycache__", "custom_components/adaptive_cover/www"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
