---
# Releasing = bump "version" in custom_components/adaptive_cover/manifest.json,
# commit, then push a matching tag:
#
#   git tag -a v1.14.0 -m "Short description" -m "Longer notes (optional)"
#   git push origin v1.14.0
#
# This workflow checks the tag against the manifest, checks that the committed
# card bundle is fresh, runs the test suite, and publishes the GitHub release
# that HACS installs from (hacs.json has zip_release: false, so HACS downloads
# the repository at the tag; no zip asset is built). The release title is
# "<tag> - <tag subject>" and the notes are the annotated tag's body followed
# by GitHub's generated notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  PIXI_VERSION: v0.81.0 # keep >= requires-pixi in pixi.toml
  FORCE_COLOR: "1"

jobs:
  version:
    name: Manifest version matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare manifest.json "version" with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=custom_components/adaptive_cover/manifest.json
          version="$(jq -r .version "$manifest")"
          if [[ "${TAG#v}" != "$version" ]]; then
            echo "::error file=$manifest::manifest version is '$version' but the tag is '$TAG'. Bump the version, commit, and tag that commit."
            exit 1
          fi
          echo "manifest version $version matches tag $TAG"

  card:
    name: Card bundle is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      # Rebuilds the card and fails if custom_components/adaptive_cover/www/
      # differs from the fresh build.
      - run: npm run check-bundle

  tests:
    name: Test suite (HA 2026.8 minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
          cache-write: false
      - run: pixi run test

  publish:
    name: Publish the GitHub release
    needs: [version, card, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" == "true" ]]; then
              echo "::error::A draft release for $TAG exists; delete it and re-run this job."
              exit 1
            fi
            echo "::notice::Release $TAG already exists; nothing to publish."
            exit 0
          fi
          # actions/checkout stores the tag as a lightweight ref; fetch the
          # tag object so an annotated tag's message is available.
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          title="$TAG"
          : > notes.md
          if [[ "$(git cat-file -t "$TAG")" == "tag" ]]; then
            subject="$(git tag -l --format='%(contents:subject)' "$TAG")"
            if [[ -n "$subject" ]]; then
              title="$TAG - $subject"
            fi
            git tag -l --format='%(contents:body)' "$TAG" > notes.md
          fi
          args=(--verify-tag --title "$title" --notes-file notes.md --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
