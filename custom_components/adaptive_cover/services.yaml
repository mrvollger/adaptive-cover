get_forecast:
  name: Get today's position forecast
  description: >-
    Returns the planned cover schedule for today as change-points
    (time, position, intent), computed from solar geometry and the
    current climate snapshot.
  fields:
    config_entry:
      name: Config entry
      description: The window key (its config entry ID, kept when the house is consolidated) or the window's title.
      required: true
      example: "SE south shades"
      selector:
        text:

hold:
  name: Hold
  description: >-
    Put windows on hold: automatic control pauses, and each window goes
    back to Auto when its hold ends. Target windows' Mode selects directly
    or by area or floor, or the house mode select for every window. Pick
    Auto (or press Return to auto) to end a hold early.
  target:
    entity:
      integration: adaptive_cover
      domain: select
  fields:
    duration:
      name: Duration
      description: >-
        How long to hold. Default: each window's manual override duration.
      required: false
      example: "04:00:00"
      selector: { duration: }
    position:
      name: Position
      description: >-
        Move the covers to this position first (0 is closed, 100 is open),
        then hold them there.
      required: false
      example: 0
      selector:
        number: { min: 0, max: 100, step: 1, unit_of_measurement: "%", mode: slider }

get_profile:
  name: Get house, floor, room or window settings
  description: >-
    Read the stored settings (read-only; returns a response). No scope:
    the house, every floor and every room. house: the house's settings.
    floor / area with an id: what that floor or room stores itself.
    window with its window key or Mode select entity: what the window
    stores itself (overrides), what it acts on (settings) and where each
    value comes from (provenance).
  fields:
    scope:
      name: Scope
      required: false
      example: window
      selector:
        select:
          options: [house, floor, area, window]
    id:
      name: Id
      description: >-
        The floor_id or area_id, or for a window its window key or its Mode
        select entity.
      required: false
      example: select.office_north_mode
      selector: { text: }

set_profile:
  name: Set house, floor or room settings
  description: >-
    Store recurring settings for the whole house, one floor or one room
    (area). Every window inherits them unless a narrower level or the
    window itself sets its own value; they apply at once, without a
    reload. A floor or room value of null removes it (the windows inherit
    again). Which level may hold which setting follows the option spec
    (for example the heating threshold: house, floor or room; the position
    delta: house only). Any recurring setting of change_settings is
    accepted; the common ones are listed here.
  fields:
    scope:
      name: Scope
      required: true
      example: area
      selector:
        select:
          options: [house, floor, area]
    id:
      name: Floor or area id
      description: The floor_id or area_id. Leave empty for the house.
      required: false
      example: office
      selector: { text: }
    climate_on:
      name: Climate control
      selector: { boolean: }
    temp_low:
      name: Heating threshold
      selector: { number: { mode: box, step: 0.5 } }
    temp_high:
      name: Cooling threshold
      selector: { number: { mode: box, step: 0.5 } }
    temp_hysteresis:
      name: Threshold hysteresis
      selector: { number: { min: 0, max: 5, step: 0.1, mode: box } }
    temp_entity:
      name: Indoor temperature sensor
      selector: { entity: { domain: [climate, sensor] } }
    manual_override_duration:
      name: Manual override duration
      selector: { duration: }
    manual_detection:
      name: Detect manual moves
      selector: { boolean: }
    eye_height:
      name: Eye height (m)
      selector: { number: { min: 0.1, max: 3, step: 0.01, mode: box } }
    occupied_distance:
      name: Seat distance from window (m)
      selector: { number: { min: 0.1, max: 10, step: 0.1, mode: box } }
    default_percentage:
      name: Default position (%)
      selector: { number: { min: 0, max: 100, step: 1, mode: slider } }
    sunset_position:
      name: Sunset position (%)
      selector: { number: { min: 0, max: 100, step: 1, mode: slider } }
    sunset_offset:
      name: Sunset offset (min)
      selector: { number: { step: 1, mode: box } }
    sunrise_offset:
      name: Sunrise offset (min)
      selector: { number: { step: 1, mode: box } }
    start_time:
      name: Start time
      selector: { time: }
    end_time:
      name: End time
      selector: { time: }
    privacy_offset:
      name: Privacy delay after sunset (min)
      selector: { number: { min: 0, max: 180, step: 5, mode: box } }

change_settings:
  name: Change settings
  description: >-
    Change any tunable option of an Adaptive Cover entry. Changes persist
    (they are written to the config entry) and take effect within seconds
    via an automatic reload. Ideal for rolling one window's tuned settings
    out to others via a script.
  fields:
    config_entry:
      name: Config entry
      description: The window key (its config entry ID, kept when the house is consolidated), title, or internal name of the window.
      required: true
      example: "SE south shades"
    name:
      name: Rename entry
      description: >-
        New name for the entry. Updates the title, device name, and log
        prefix; entity unique IDs are unchanged.
      required: false
      example: "Family south"
      selector:
        text:
    overhang_depth:
      name: Overhang depth (m)
      selector: { number: { min: 0, max: 5, step: 0.01, mode: box } }
    overhang_height:
      name: Overhang height above sill (m)
      selector: { number: { min: 0, max: 10, step: 0.01, mode: box } }
    eye_height:
      name: Eye height (m)
      selector: { number: { min: 0, max: 3, step: 0.01, mode: box } }
    occupied_distance:
      name: Seat distance from window (m)
      selector: { number: { min: 0, max: 10, step: 0.1, mode: box } }
    privacy_mode:
      name: Close after dusk for privacy
      selector: { boolean: }
    privacy_offset:
      name: Privacy delay after sunset (min)
      selector: { number: { min: 0, max: 180, step: 5, mode: box } }
    ignore_climate:
      name: Ignore climate control
      description: This window follows the sun only; the house's Climate switch does not steer it.
      selector: { boolean: }
    temp_entity:
      name: Indoor temperature sensor
      selector: { entity: { domain: [sensor, climate] } }
    presence_entity:
      name: Presence entity
      selector: { entity: { domain: [device_tracker, zone, binary_sensor, input_boolean] } }
    weather_entity:
      name: Weather entity
      selector: { entity: { domain: weather } }
    weather_state:
      name: Sunny weather conditions
      selector: { text: { multiple: true } }
    temp_low:
      name: Heating threshold (Home Assistant's temperature unit)
      description: >-
        Below this indoor temperature it is "winter". In Home Assistant's
        temperature unit: 5-30 °C or 40-90 °F.
      selector: { number: { min: 5, max: 90, step: 0.5, mode: box } }
    temp_high:
      name: Cooling threshold (Home Assistant's temperature unit)
      description: >-
        Above this indoor temperature it is "summer". In Home Assistant's
        temperature unit: 10-40 °C or 50-100 °F.
      selector: { number: { min: 10, max: 100, step: 0.5, mode: box } }
    temp_hysteresis:
      name: Threshold hysteresis (Home Assistant's temperature unit)
      description: >-
        How far past a threshold the temperature must go before the season
        changes back (0: off). In Home Assistant's temperature unit: 0-3 °C
        or 0-5 °F.
      selector: { number: { min: 0, max: 5, step: 0.1, mode: box } }

add_entry:
  name: Add a window
  description: >-
    Create a new Adaptive Cover entry without the wizard. Start from a
    template entry (copy_from) and override what differs, or from defaults.
  fields:
    name:
      name: Name
      required: true
      example: "Den south"
      selector: { text: }
    cover:
      name: Cover entity
      description: >-
        The cover this window drives. A window drives exactly one cover, and
        a cover belongs to one window.
      example: "cover.den_south_shades"
      selector: { entity: { domain: cover } }
    covers:
      name: Cover entities (older form)
      description: >-
        Still accepted for older scripts: a list with exactly one cover.
        Use cover instead.
      example: "[cover.den_south_shades]"
      selector: { entity: { multiple: true, domain: cover } }
    copy_from:
      name: Copy settings from
      description: Entry ID, title, or name of an existing entry to use as template.
      example: "SW south shade"
      selector: { text: }
    set_azimuth:
      name: Window azimuth (°)
      selector: { number: { min: 0, max: 359, mode: box } }
